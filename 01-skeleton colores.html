<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

  <style>
    body {
      background-image: url("FondoGeometria.jpg");
      background-repeat: no-repeat;          
      background-size: cover;                
      background-position: center;          
    }
  </style>

    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d');

      // Fondo degradado
      var skyGradient = context.createLinearGradient(0, 0, 0, canvas.height);
      skyGradient.addColorStop(0, "#001f4d");
      skyGradient.addColorStop(1, "#1338BE");
      context.fillStyle = skyGradient;
      context.fillRect(0, 0, canvas.width, canvas.height);

      // Casa con gradiente
      var gradient = context.createLinearGradient(270, 270, 100, 100);
      gradient.addColorStop(0, "#804000");
      gradient.addColorStop(1, "#FFA500");
      context.save();
      context.lineWidth = 3;
      context.strokeStyle = "brown";
      context.fillStyle = gradient;
      context.beginPath();
      context.moveTo(230,100);
      context.lineTo(320,50);
      context.lineTo(400,100);
      context.lineTo(230,100);
      context.fill();
      context.stroke();
      context.fillRect(270, 100, 100, 100);
      context.strokeRect(270, 100, 100, 100);
      context.restore();

      // Luna con degradado gris
      var moonGradient = context.createRadialGradient(600, 100, 10, 600, 100, 50);
      moonGradient.addColorStop(0, "#ffffff");
      moonGradient.addColorStop(0.5, "#cccccc");
      moonGradient.addColorStop(1, "#666666");

      context.fillStyle = moonGradient;
      context.strokeStyle = "darkgray";
      context.lineWidth = 2;
      context.beginPath();
      context.arc(600, 100, 50, 0, Math.PI * 2, true);
      context.fill();
      context.stroke();

      // círculo para media luna
      context.fillStyle = skyGradient;
      context.beginPath();
      context.arc(620, 100, 50, 0, Math.PI * 2, true);
      context.fill();

      // Hongo
      context.fillStyle = "saddlebrown";
      context.strokeStyle = "darkorange";
      context.lineWidth = 2;
      context.fillRect(500, 250, 40, 100);
      context.strokeRect(500, 250, 40, 100);

      context.fillStyle = "red";
      context.strokeStyle = "darkred";
      context.beginPath();
      context.arc(520, 250, 80, Math.PI, 0, false);
      context.closePath();
      context.fill();
      context.stroke();
      

      // Hoja
      context.fillStyle = "green";
      context.strokeStyle = "darkgreen";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(150, 250); // punta superior
      context.quadraticCurveTo(100, 320, 140, 420); // lado izquierdo
      context.quadraticCurveTo(150, 460, 160, 420); // base más redondeada
      context.quadraticCurveTo(200, 320, 150, 250); // lado derecho
      context.closePath();
      context.fill();
      context.stroke();

      // Estrella
      context.fillStyle = "#FFE442";
      context.strokeStyle = "#FFA500";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(500, 100);
      context.lineTo(508, 120);
      context.lineTo(530, 122);
      context.lineTo(513, 136);
      context.lineTo(518, 158);
      context.lineTo(500, 146);
      context.lineTo(482, 158);
      context.lineTo(487, 136);
      context.lineTo(470, 122);
      context.lineTo(492, 120);
      context.closePath();
      context.fill();
      context.stroke();

      
    };
    </script>
  </body>
</html>
