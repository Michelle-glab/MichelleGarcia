<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rotate to Mouse</title>

 <style>
      body { 
       
        background-color:rgb(27, 26, 25);
        text-align: center;
        
        
      }
      canvas {
        background-color:rgb(27, 26, 25);
      }

      aside {
         color:rgb(255, 237, 214);
      }

    </style>


    
  </head>
  <body>
    <canvas id="canvas" width="1000" height="700"></canvas>
    <aside>Move mouse on canvas element.</aside>
    
    <script src="utils.js"></script>
    <!--<script src="./classes/arrow.js"></script>-->
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas),
          pelota = new Image();
          pelota.src = 'LunaMedia.png';
        
      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.save();
        var x = canvas.width / 2,
            y = canvas.height / 2;

        context.translate(x, y);
        var dx = mouse.x - x,
            dy = mouse.y - y;
        
        var radianes = Math.atan2(dy, dx); //radians
        console.log(radianes);
        context.rotate(radianes); //radians
        context.drawImage(pelota, -pelota.width/2, -pelota.height/2);
        context.restore();

        
      }());
    };
    </script>
  </body>
</html>
