<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Reto Onda Sinoidal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="deco.css">

  </head>  
  <body>

    <h1 class="chango-regular">Galaxy</h1>
    <canvas id="canvas" width="1000" height="650"></canvas>
    
    <script src="utils.js"></script>
    
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
        
          fondo = new Image();
          pelota = new Image(),
          angle2=60,
          centerScale = 1,
          range = .5,
          escalaX = 1,
          escalaY = 1,
          speed2 = 0.03,
          posicionX = 0,
          posicionY = 20,
          centerY = 150,
          rangeY = 50,
          speedX = 1;
          fondo.src = "Galaxy.PNG"
          pelota.src = "star.PNG";


        
      //ball.x = canvas.width / 2;
      //ball.y = canvas.height / 2;
        
      fondo.onload = function() {
    // Comenzar animación cuando el fondo esté cargado
      requestAnimationFrame(drawFrame);
       };

      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.drawImage(fondo, 0, 0, canvas.width, canvas.height);
        
        context.save();
        context.translate(0, 200);
        posicionY = centerY / 2 + Math.sin(angle2) * rangeY;
        angle2 += speed2;
        posicionX += speedX;
        context.drawImage(pelota, posicionX, posicionY, pelota.width*escalaX, pelota.height*escalaY);
        context.restore();

          if (posicionX + pelota.width * escalaX > canvas.width) {
          posicionX = canvas.width - pelota.width * escalaX; // lo coloca justo en el borde
          speedX = -speedX;
           }
          if (posicionX < 0) {
          posicionX = 0;
          speedX = -speedX;
           }
          posicionX += speedX;

  // Rebote en Y con corrección
          if (posicionY + pelota.height * escalaY > canvas.height) {
          posicionY = canvas.height - pelota.height * escalaY;
          speedY = -speedY;
           }
          if (posicionY < 0) {
          posicionY = 0;
          speedY = -speedY;
           }
          posicionY += speedY;


      }());
    };
    </script>
  </body>
</html>
